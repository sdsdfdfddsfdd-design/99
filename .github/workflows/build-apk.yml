name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (bundled inside APK)
        env:
          VITE_PUBLIC_SERVER_URL: ${{ vars.VITE_PUBLIC_SERVER_URL || 'https://ais-pre-7cgo2aerub3igrwaspnucj-1016353730156.europe-west2.run.app' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload fokashat-vip.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fokashat-vip-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
